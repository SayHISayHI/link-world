<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>拾海 · Node Tide Capture</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 280px;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 12px;
        line-height: 18px;
      }

      button {
        display: inline-flex;
        height: 36px;
        align-items: center;
        justify-content: center;
        border: 1px solid #0f766e;
        border-radius: 6px;
        background: #0f766e;
        color: white;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      #status {
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>拾海 · Node Tide</h1>
        <p>Save the current page to your local library.</p>
      </div>
      <button id="save" type="button">Save current page</button>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
