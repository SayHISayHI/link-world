[package]
name = "node-tide"
version = "0.1.0"
description = "Local-first personal information asset system"
authors = ["Node Tide"]
edition = "2021"
rust-version = "1.85"
default-run = "node-tide"

[lib]
name = "node_tide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "node-tide-cli"
path = "src/bin/node-tide-cli.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
ego-tree = "0.10"
genai = { version = "0.6.5", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "macros", "migrate"] }
tauri = { version = "2.9.0", features = [] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
