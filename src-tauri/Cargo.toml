[package]
name = "link-world"
version = "0.1.0"
description = "Local-first personal information asset system"
authors = ["Link World"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "link_world_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.9.0", features = [] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros"] }

