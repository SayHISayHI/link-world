[package]
name = "link-world"
version = "0.1.0"
description = "Local-first personal information asset system"
authors = ["Link World"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "link_world_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
ego-tree = "0.10"
genai = { version = "0.6.5", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tauri = { version = "2.9.0", features = [] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
